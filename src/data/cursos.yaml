  - id: dyas
    codigo: DYAS
    nombre: Diseño y Arquitectura de Software
    nivel: pregrado
    descripcion: >-
      Construir un sistema profesional con los estándares actuales de la
      industria, mediante retos.
    aeva: ""
    modulos:
