# Resumen corto que va debajo del nombre.
resumen: >-
  Profesor de la Facultad de Ingeniería de la Universidad de La Sabana.
  Dicta cursos de pregrado y de la Maestría en Ingeniería de Software.

# Texto de presentación de la página Sobre mí. Mientras esté vacío, la página
# muestra un recuadro marcado "Texto por completar".
# Cada párrafo es un elemento de la lista. Ejemplo:
# presentacion:
#   - Primer párrafo.
#   - Segundo párrafo.
presentacion:
  - >-
    Sus cursos cubren arquitectura empresarial, diseño y arquitectura de
    software, estructuras de datos y algoritmos y procesamiento de lenguaje
    natural en pregrado, y arquitectura empresarial, gestión de configuración
    y testing de software en la maestría. Se trabajan con talleres prácticos y
    proyectos: en Arquitectura Empresarial cada equipo lleva la arquitectura de
    un cliente real del estado actual al estado objetivo, y en Diseño y
    Arquitectura de Software se construye un sistema mediante retos.
  - >-
    Acompaña el semillero Maratonistas de Programación de la IEEE Computer
    Society UniSabana. Las presentaciones, talleres y guías de sus cursos se
    publican en esta página y en sus repositorios de GitHub bajo licencia
    CC BY-NC-SA 4.0.

# Áreas de trabajo que se muestran en la página Sobre mí.
areas:
  - Arquitectura empresarial
  - Diseño y arquitectura de software
  - Testing y validación de software
  - Gestión de configuración y mantenimiento de software
  - Estructuras de datos y algoritmos
  - Procesamiento de lenguaje natural

