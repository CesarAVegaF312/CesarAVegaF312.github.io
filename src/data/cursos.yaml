# Cursos, módulos, presentaciones y talleres.
#
# La guía completa para editar este archivo está en el README del repositorio.
#
# Estructura de un curso:
#
#   - id: dyas                      identificador en minúsculas, sin espacios ni tildes.
#                                   Define la dirección de la página (/cursos/dyas/)
#                                   y la carpeta de presentaciones (public/presentaciones/dyas/).
#     codigo: DYAS
#     nombre: Diseño y Arquitectura de Software
#     nivel: pregrado               pregrado | maestria
#     programa: ...                 opcional, se muestra debajo del nombre
#     descripcion: ...
#     aeva: ""                      URL del asistente del curso; vacío = no se muestra
#     nombre_modulos: Módulos       opcional: Módulos, Unidades, Sesiones...
#     modulos:
#       - titulo: Introducción
#         descripcion: ...          opcional
#         presentaciones:
#           - titulo: Introducción
#             archivo: 01-introduccion.pdf      archivo en public/presentaciones/<id>/
#           - titulo: Presentación web
#             url: https://...                  o enlace externo (PDF o HTML)
#         talleres:
#           - titulo: Taller de ...
#             repo: NOMBRE-DEL-REPO             repositorio en github.com/CesarAVegaF312
#             descripcion: Una frase sobre lo que enseña.
#         material:                             otros enlaces de la unidad, opcional
#           - titulo: Portada de la unidad
#             url: https://...
#     talleres: []                  talleres o guías de todo el curso, opcional
#
# Una presentación con "archivo" solo aparece en el sitio cuando el archivo existe
# en public/presentaciones/<id>/. Mientras falte, el build lo lista en un aviso.

cursos:
  # ---------------------------------------------------------------- Pregrado

  - id: arem
    codigo: AREM
    nombre: Arquitectura Empresarial
    nivel: pregrado
    descripcion: >-
      Alinear la estrategia de la organización con soluciones tecnológicas
      (procesos, datos, aplicaciones, infraestructura y seguridad) mediante un
      proyecto con un cliente real que va del estado actual al estado objetivo.
    aeva: ""
    modulos:
      - titulo: Introducción
        presentaciones:
          - titulo: Introducción
            archivo: 01-introduccion.pdf

      - titulo: Arquitectura Empresarial
        presentaciones:
          - titulo: Arquitectura Empresarial
            archivo: 02-arquitectura-empresarial.pdf
        talleres:
          - titulo: Taller 0. Preliminary y Architecture Vision
            repo: AREM-Taller_0_Preliminary_Vision
            descripcion: >-
              Define el alcance, el contexto estratégico y la visión de la
              arquitectura del cliente con las fases Preliminary y Architecture
              Vision del ADM de TOGAF.

      - titulo: Modelado de procesos (BPMN)
        presentaciones:
          - titulo: Modelado de procesos (BPMN)
            archivo: 03-modelado-procesos-bpmn.pdf
        talleres:
          - titulo: Taller 1. Modelado de procesos con BPMN
            repo: AREM-Taller_1_BPMN
            descripcion: >-
              Modela en BPMN un proceso de negocio real del cliente, con sus
              eventos, actividades, decisiones, actores y puntos críticos.

      - titulo: Modelado de información (ERD)
        presentaciones:
          - titulo: Modelado de información (ERD)
            archivo: 04-modelado-informacion-erd.pdf
        talleres:
          - titulo: Taller 2. Modelo de información y diagrama de contexto
            repo: AREM-Taller_2_Modelo_Informacion
            descripcion: >-
              Modela las entidades del dominio del cliente con un diagrama
              entidad-relación y los flujos de información entre actores y
              sistemas con un diagrama de contexto.

      - titulo: Documentar la arquitectura (C4)
        presentaciones:
          - titulo: Documentar la arquitectura (C4)
            archivo: 05-documentar-arquitectura-c4.pdf
        talleres:
          - titulo: Taller 3. Arquitectura actual con el modelo C4
            repo: AREM-Taller_3_Arquitectura_C4
            descripcion: >-
              Representa la arquitectura actual del sistema del cliente con las
              vistas de contexto (C1) y de contenedores (C2) del modelo C4.

      - titulo: Infraestructura y topologías
        presentaciones:
          - titulo: Infraestructura y topologías
            archivo: 06-infraestructura-topologias.pdf
        talleres:
          - titulo: Taller 4. Mapa de infraestructura y diagnóstico técnico
            repo: AREM-Taller_4_Infraestructura
            descripcion: >-
              Construye el mapa de la infraestructura tecnológica del sistema y
              diagnostica sus debilidades, cuellos de botella y oportunidades
              de mejora.

      - titulo: Seguridad y STRIDE
        presentaciones:
          - titulo: Seguridad y STRIDE
            archivo: 07-seguridad-stride.pdf
        talleres:
          - titulo: Taller 5. Evaluación de seguridad con STRIDE
            repo: AREM-Taller_5_Seguridad
            descripcion: >-
              Analiza y prioriza los riesgos de seguridad de una parte crítica
              del sistema con las seis categorías de STRIDE.

      - titulo: Normatividad y cumplimiento
        presentaciones:
          - titulo: Normatividad y cumplimiento
            archivo: 08-normatividad-cumplimiento.pdf
        talleres:
          - titulo: Taller 6. Checklist de cumplimiento normativo
            repo: AREM-Taller_6_Normatividad
            descripcion: >-
              Verifica el cumplimiento legal y normativo del sistema frente a
              marcos como ISO/IEC 27001, GDPR y la Ley 1581 de 2012 de
              protección de datos personales.

      - titulo: Oportunidades y soluciones
        presentaciones:
          - titulo: Oportunidades y soluciones
            archivo: 09-oportunidades-soluciones.pdf
        talleres:
          - titulo: Taller 7. Opportunities and Solutions
            repo: AREM-Taller_7_Opportunities_Solutions
            descripcion: >-
              Propone la arquitectura objetivo de aplicaciones y tecnología,
              identifica las brechas frente al estado actual y prioriza las
              soluciones que las cierran.

      - titulo: Gobierno de arquitectura
        presentaciones:
          - titulo: Gobierno de arquitectura
            archivo: 10-gobierno-arquitectura.pdf
        talleres:
          - titulo: Taller 9. Simulación de comité de arquitectura
            repo: AREM-Taller_9_Presentacion_Final
            descripcion: >-
              Presenta y defiende la solución arquitectónica final del cliente
              ante un comité simulado, con un plan de implementación por fases.

      - titulo: Riesgos arquitectónicos
        presentaciones:
          - titulo: Riesgos arquitectónicos
            archivo: 11-riesgos-arquitectonicos.pdf
        talleres:
          - titulo: Taller 8. Integración de vistas de arquitectura
            repo: AREM-Taller_8_Integracion_Vistas
            descripcion: >-
              Integra las vistas de negocio, información, aplicaciones,
              infraestructura y seguridad en una narrativa coherente con los
              objetivos del cliente.

    talleres:
      - titulo: Proyecto con el cliente real
        repo: AREM-Proyecto-Cliente
        descripcion: >-
          Explica cómo organizar en un solo repositorio por equipo el trabajo
          con el cliente real de los diez talleres, de modo que el cliente
          pueda usar el resultado.
      - titulo: Notación ArchiMate
        repo: AREM-ArchiMate
        descripcion: >-
          Guía de referencia de ArchiMate, la notación de modelado del curso,
          y de cómo se relaciona con el diagrama de cada taller.
      - titulo: Modelado con Astah UML
        repo: AREM-astah
        descripcion: >-
          Explica cómo instalar Astah UML con licencia de estudiante y
          construir diagramas UML paso a paso.

