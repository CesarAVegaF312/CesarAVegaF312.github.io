            repo: DYAS-Taller_nivelacion
            descripcion: >-
              Nivela los fundamentos de Java y Maven: programación orientada a
              objetos, compilación desde consola, empaquetado en .jar y ciclo de
              vida de un proyecto.

      - titulo: Fundamentos de ingeniería de software
        presentaciones:
          - titulo: Fundamentos de ingeniería de software
            archivo: 02-fundamentos-ingenieria-software.pdf
        talleres:
          - titulo: Persistencia con MyBatis
            repo: DYAS-MyBatis_Introduction_VideoRental
            descripcion: >-
              Introduce el framework de persistencia MyBatis con mappers que
              reconstruyen los objetos de un sistema de alquiler de videos
              sobre SQLite.

      - titulo: SOLID y patrones de diseño
        presentaciones:
          - titulo: SOLID y patrones de diseño
            archivo: 03-solid-patrones-diseno.pdf
        talleres:
          - titulo: Patrones creacionales y refactoring de un juego
            repo: DYAS-GoF-CreationalPatterns-GameRefactoring
            descripcion: >-
              Aplica la fábrica abstracta a un controlador de fabricación de
              pizzas y la inversión de dependencias para desacoplar la lógica
              de un juego de su estilo de visualización.
          - titulo: Código base de la fábrica de pizzas
            repo: DYAS-GoF-Patterns-Creational-PizzaFactory
            descripcion: >-
              Código de partida, sin refactorizar, para la primera parte del
              taller de patrones creacionales.
          - titulo: Patrón Observer
            repo: DAYS-BehavioralPatterns-observer
            descripcion: >-
              Implementa el patrón Observer para que los cambios de
              configuración del sistema se notifiquen automáticamente a los
              objetos interesados.
          - titulo: Patrón Strategy
            repo: DAYS-BehavioralPatterns-strategy
            descripcion: >-
              Implementa el patrón Strategy para intercambiar el método de
              autenticación (XML, base de datos o memoria) sin modificar el
              código que lo usa.
          - titulo: Patrón Adapter en un reproductor de audio
            repo: DAYS-MusicPlayer
            descripcion: >-
              Aplica el patrón Adapter para que un reproductor use dos
              bibliotecas de terceros incompatibles a través de una sola
              interfaz.
          - titulo: Patrones estructurales en un cliente de mensajería
            repo: DYAS-GuasappMessenger
            descripcion: >-
              Protege un cliente de mensajería de terceros, sin modificarlo,
              con validaciones combinables de contenido, longitud y frecuencia
              construidas con patrones estructurales.
          # Repositorios públicos de versiones anteriores del curso que no se
          # publican por ahora. Para mostrarlos, quite el signo # de las líneas.
          # - titulo: Factory Method, implementación de referencia
          #   repo: DYAS-GoF-FactoryMethod-ReferenceExample
          #   descripcion: >-
