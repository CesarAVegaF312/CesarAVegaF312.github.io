      - titulo: Arquitecturas (estilos, SOA, microservicios, REST)
        presentaciones:
          - titulo: Arquitecturas (estilos, SOA, microservicios, REST)
            archivo: 05-arquitecturas.pdf
        # talleres:
        #   - titulo: Event Sourcing
        #     repo: DAYS-Pattern_EventSourcing
