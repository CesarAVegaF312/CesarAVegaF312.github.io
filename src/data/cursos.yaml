      - titulo: Arquitectura limpia y hexagonal
        presentaciones:
          - titulo: Arquitectura limpia y hexagonal
            archivo: 06-arquitectura-limpia-hexagonal.pdf

      - titulo: DevOps
        presentaciones:
          - titulo: DevOps
            archivo: 07-devops.pdf
        talleres:
          - titulo: Integración continua con GitHub Actions
            repo: DAYS-Integracion_continua
            descripcion: >-
              Configura un pipeline de integración continua para un proyecto
              Java y Maven que ejecuta las pruebas, exige una cobertura mínima
              con JaCoCo y protege la rama principal.
          - titulo: Docker y Docker Compose
            repo: DYAS-Docker
            descripcion: >-
              Enseña a crear imágenes, ejecutar contenedores y componer
              aplicaciones de varios servicios con Docker y Docker Compose,
              hasta contenerizar una aplicación Spring Boot.
          - titulo: DevSecOps y despliegue continuo
            repo: DYAS-DevSecOps
            descripcion: >-
              Incorpora reglas de arquitectura, controles de seguridad y
              despliegue automático al pipeline de GitHub Actions de un
              servicio Spring Boot con arquitectura hexagonal.
          - titulo: Monitoreo y observabilidad
            repo: DYAS-Monitoreo
            descripcion: >-
              Instrumenta una aplicación Spring Boot y recolecta y visualiza
              sus métricas y trazas con Prometheus, Grafana y Jaeger.

      - titulo: Comunicación asíncrona
        presentaciones:
          - titulo: Comunicación asíncrona
            archivo: 08-comunicacion-asincrona.pdf
        talleres:
          - titulo: Multi-threading en Java
            repo: DYAS-Multi-threading
            descripcion: >-
              Practica los conceptos básicos de concurrencia en Java con
              ejemplos de creación y coordinación de varios hilos.
          - titulo: Mensajería con RabbitMQ
            repo: DYAS-RabbitMQ
            descripcion: >-
              Introduce la mensajería asíncrona con RabbitMQ mediante ejemplos
              de envío y recepción de mensajes en Java y Python.
          - titulo: RabbitMQ con Spring Boot
            repo: DYAS-RabbitMQ_SpringBoot
            descripcion: >-
              Integra RabbitMQ en una aplicación Spring Boot creada desde cero,
              con un productor y un consumidor de mensajes.
          - titulo: Programación reactiva con RxJava y Reactor
            repo: DYAS-Programacion_reactiva
            descripcion: >-
              Usa operadores reactivos (map, filter, flatMap, merge y zip) con
              RxJava y Reactor y expone un endpoint reactivo con Spring
              WebFlux.
          # - titulo: Introducción a Apache Kafka
          #   repo: DYAS-Kafka
          #   descripcion: >-
          #     Introduce Apache Kafka con Docker: tópicos, productores y
          #     consumidores desde consola y desde código.

      - titulo: Documentar la arquitectura
        presentaciones:
          - titulo: Documentar la arquitectura
            archivo: 09-documentar-arquitectura.pdf

